name: options-scan

# Refresh the options + levels snapshots and accrue IV history.
# Runs on weekdays during US market hours (UTC); also triggerable by hand.
# The commit push auto-deploys on Vercel; the dashboards also read the snapshots
# straight from GitHub raw, so data is fresh regardless of deploy timing.
on:
  # Run during US market hours (15:00 & 19:00 UTC = 11am & 3pm ET) so the
  # options chain has live bid/ask/OI. Pre-market runs are guarded in the
  # script (option quotes are 0 then) and won't overwrite good data.
  schedule:
    - cron: "0 15,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run options scan
        run: python tools/scan_options.py --workers 6
      - name: Run levels scan
        run: python tools/scan_levels.py --workers 8
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_results.json iv_history.json levels_results.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update scan snapshots"
            git push
          fi
