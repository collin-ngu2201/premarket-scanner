name: options-scan

# Refresh the options screener snapshot (scan_results.json) and accrue IV history.
# Runs on weekdays ~pre-open and ~near-close (UTC); also triggerable by hand.
# The commit push fires the Netlify build hook, so the live dashboard updates.
on:
  # Run during US market hours (15:00 & 19:00 UTC = 11am & 3pm ET) so the
  # options chain has live bid/ask/OI. Pre-market runs are guarded in the
  # script (option quotes are 0 then) and won't overwrite good data.
  schedule:
    - cron: "0 15,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run options scan
        run: python tools/scan_options.py --workers 6
      - name: Run levels scan
        run: python tools/scan_levels.py --workers 8
      - name: Commit snapshots and trigger deploy
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_results.json iv_history.json levels_results.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update scan snapshots"
            git push
            # Explicitly trigger the Netlify build so the live site updates.
            # (Netlify skips builds for git events tagged [skip ci], and the
            # push webhook can go stale — a direct build-hook POST is reliable.)
            if [ -n "$NETLIFY_BUILD_HOOK" ]; then
              curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK" && echo "Netlify deploy triggered"
            fi
          fi
