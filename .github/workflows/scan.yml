name: market-scans

# Refresh the options + levels + money-flow snapshots and accrue IV history.
# Runs on weekdays during US market hours (UTC); also triggerable by hand.
# The commit push auto-deploys on Vercel; the dashboards also read the snapshots
# straight from GitHub raw, so data is fresh regardless of deploy timing.
on:
  # Minute 7, not minute 0. GitHub's cron is best effort and the top of the
  # hour is its most contended slot: measured over two weeks, the 15:00 slot
  # started 188-231 min late EVERY time and Mondays silently dropped a run
  # altogether. An off-peak minute reduces both.
  #
  #   15:07 UTC = 11:07 ET  mid-session, so the options chain has live
  #                         bid/ask/OI (pre-market runs are guarded in the
  #                         script -- option quotes are 0 then).
  #   20:07 UTC = 16:07 ET  just past the close, so the levels and money-flow
  #                         scans see a completed daily bar even if the run
  #                         fires on time. Any delay only pushes it later,
  #                         which is the harmless direction.
  schedule:
    - cron: "7 15,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run options scan
        run: python tools/scan_options.py --workers 6
      - name: Run levels scan
        run: python tools/scan_levels.py --workers 8
      # The daily flow read drops today's still-forming bar (see
      # scan_flow.drop_forming_bar), so this is safe to run at any hour --
      # the mid-session run simply scores through yesterday's close.
      - name: Run money-flow scan
        run: python tools/scan_flow.py --workers 8
      # always(): a failure in any one scanner must not throw away the snapshots
      # the others already produced. Adding the flow scan ahead of this step
      # meant a flow error would have discarded the options and levels results
      # too. The job still reports failure -- it just commits what succeeded.
      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_results.json iv_history.json levels_results.json flow_results.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update scan snapshots"
            git push
          fi
